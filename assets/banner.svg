<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<style>
.bg0{stop-color:#fbf6e6}.bg1{stop-color:#eaf3e6}
.t{fill:#1f2328}.m{fill:#4d5761}.chip{fill:#ffffff;stroke:#d8d0b4}.chipt{fill:#3a3f45}
.furrow{stroke:#d9c98f}.price{stroke:#2f8f4e}.tick{stroke:#c9a227}.buy{fill:#c9a227}.sell{fill:#2f8f4e}.axis{stroke:#cfc6a6}
.medal{fill:#c27c3a}.medalr{stroke:#9a5b23}
@media (prefers-color-scheme:dark){
.bg0{stop-color:#1d2016}.bg1{stop-color:#14201a}
.t{fill:#f0f3f6}.m{fill:#a3acb5}.chip{fill:#1c2128;stroke:#3a3f2c}.chipt{fill:#d6dbe0}
.furrow{stroke:#3a3a24}.price{stroke:#3fb950}.tick{stroke:#d4b13c}.buy{fill:#d4b13c}.sell{fill:#3fb950}.axis{stroke:#3a3f2c}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="bg0"/><stop offset="1" class="bg1"/></linearGradient>
<clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="340" fill="url(#bg)"/>
<!-- field furrows -->
<g class="furrow" stroke-width="2" fill="none" opacity="0.9">
<path d="M640 340 C 760 300, 980 286, 1200 284"/>
<path d="M600 340 C 740 312, 980 304, 1200 304"/>
<path d="M560 340 C 720 322, 980 322, 1200 322"/>
</g>
<!-- wheat price: steps up at every town consumption tick (every 4 steps) -->
<g transform="translate(660 36)">
<line x1="0" y1="200" x2="520" y2="200" class="axis" stroke-width="1.5"/>
<g class="tick" stroke-width="1" stroke-dasharray="2 5">
<line x1="40" y1="20" x2="40" y2="200"/><line x1="160" y1="20" x2="160" y2="200"/>
<line x1="280" y1="20" x2="280" y2="200"/><line x1="400" y1="20" x2="400" y2="200"/>
</g>
<path class="price" stroke-width="3.5" fill="none" stroke-linejoin="round"
 d="M0 176 H40 V156 H72 V164 H160 V132 H192 V140 H280 V108 H312 V116 H400 V84 H432 V92 H520"/>
<g>
<circle cx="40" cy="176" r="7" class="buy"/><circle cx="72" cy="156" r="7" class="sell"/>
<circle cx="160" cy="164" r="7" class="buy"/><circle cx="192" cy="132" r="7" class="sell"/>
<circle cx="280" cy="140" r="7" class="buy"/><circle cx="312" cy="108" r="7" class="sell"/>
<circle cx="400" cy="116" r="7" class="buy"/><circle cx="432" cy="84" r="7" class="sell"/>
</g>
<text x="0" y="230" class="m" font-size="14">buy wheat before the town eats, sell it after · every 4 steps, ~110 times a game</text>
</g>
<!-- title block -->
<text x="64" y="104" class="t" font-size="58" font-weight="700" letter-spacing="-1">Kaggriculture</text>
<text x="66" y="142" class="m" font-size="19">A market-microstructure bot for Kaggle's two-player farming game</text>
<g font-size="15" font-weight="600">
<g transform="translate(64 176)">
<rect width="158" height="38" rx="19" class="chip" stroke-width="1.5"/>
<circle cx="24" cy="19" r="9" class="medal"/><circle cx="24" cy="19" r="9" fill="none" class="medalr" stroke-width="1.5"/>
<text x="42" y="24.5" class="chipt">Bronze medal</text>
</g>
<g transform="translate(234 176)">
<rect width="204" height="38" rx="19" class="chip" stroke-width="1.5"/>
<text x="20" y="24.5" class="chipt">702nd of 10,148 teams</text>
</g>
<g transform="translate(450 176)">
<rect width="128" height="38" rx="19" class="chip" stroke-width="1.5"/>
<text x="20" y="24.5" class="chipt">top 7 percent</text>
</g>
</g>
<text x="66" y="262" class="m" font-size="15">Kaggle Featured Simulation · final standings 14 Oct 2026</text>
</g>
</svg>
